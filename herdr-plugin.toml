id = "herdr-dopa-monitor"
name = "dopa macOS Sleep Guard"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Native Swift sleep guard keeps macOS awake with dopa while herdr agents work. Event-driven, with a prebuilt arm64 binary."
platforms = ["macos"]

# GitHub installs download the matching signed/checksummed arm64 binary.
# A local Swift build is only a fallback when a release asset is unavailable.
# `plugin link` intentionally skips [[build]]; developers run scripts/build.sh.
[[build]]
platforms = ["macos"]
command = ["sh", "scripts/install-prebuilt.sh"]

# Hooks remain one-shot and event-driven. Only the internal `hold` subprocess
# persists, owning the dopa socket connection and exiting when the plugin is
# disabled/unlinked, the lid closes (when configured), or dopa disconnects.

# Reconcile once after herdr restores the session. Tolerates
# unknown/missing/malformed event payloads by behaving like `once`.
[[startup]]
platforms = ["macos"]
command = ["./bin/herdr-dopa-monitor", "event"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["macos"]
command = ["./bin/herdr-dopa-monitor", "event"]

[[events]]
on = "pane.agent_detected"
platforms = ["macos"]
command = ["./bin/herdr-dopa-monitor", "event"]

[[events]]
on = "pane.created"
platforms = ["macos"]
command = ["./bin/herdr-dopa-monitor", "event"]

[[events]]
on = "pane.closed"
platforms = ["macos"]
command = ["./bin/herdr-dopa-monitor", "event"]

[[events]]
on = "pane.exited"
platforms = ["macos"]
command = ["./bin/herdr-dopa-monitor", "event"]

[[actions]]
id = "status"
title = "Print dopa monitor status"
contexts = ["workspace"]
command = ["./bin/herdr-dopa-monitor", "status"]

[[actions]]
id = "stop"
title = "Stop the owned dopa session and reset the guard"
contexts = ["workspace"]
command = ["./bin/herdr-dopa-monitor", "stop"]
