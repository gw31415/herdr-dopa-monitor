name: Tests

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check packaging script syntax
        run: sh -n scripts/*.sh
      - name: Run Swift tests
        run: swift test
      - name: Build the local release binary
        run: scripts/build.sh
      - name: Run native dopa API contract test
        run: python3 tests/test_dopa_api.py
      - name: Verify the binary
        run: |
          test -x bin/herdr-dopa-monitor
          bin/herdr-dopa-monitor --version
